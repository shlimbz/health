<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>나와 닮은 캐릭터는?</title>
  <meta name="description" content="24개의 질문에 답하고 나와 가장 닮은 캐릭터를 찾아보세요." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <div class="app-shell">
    <main class="test-card">

      <!-- ============================ 화면 1: 메인 ============================ -->
      <section id="screen-main" class="screen">
        <div class="main-orb" id="main-icon" aria-hidden="true">🔮</div>
        <h1 class="main-title" id="main-title">나와 닮은 캐릭터는?</h1>
        <p class="main-subtitle" id="main-subtitle">24개의 질문에 답하고
나와 가장 닮은 캐릭터를 찾아보세요.</p>

        <button type="button" class="primary-btn" id="start-test-btn">테스트 시작하기</button>

        <p class="participant-note" id="participant-note"></p>
      </section>

      <!-- ============================ 화면 2: 질문 ============================ -->
      <section id="screen-quiz" class="screen" hidden>
        <div class="quiz-header">
          <button type="button" class="quiz-back-btn" id="quiz-back-btn" aria-label="이전 질문으로">‹</button>
          <span class="quiz-progress-label" id="progress-label">Q 01 / 24</span>
          <span style="width:34px" aria-hidden="true"></span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 4%;"></div>
        </div>

        <div class="quiz-body" id="quiz-body">
          <h2 class="question-text" id="question-text">질문이 여기에 표시됩니다.</h2>
          <div class="answers-list" id="answers-list"></div>
        </div>
      </section>

      <!-- ============================ 화면 3: 결과 ============================ -->
      <section id="screen-result" class="screen" hidden>
        <p class="result-eyebrow">🔮 테스트 결과</p>
        <h2 class="result-heading">당신과 가장 닮은 캐릭터는</h2>

        <div class="result-figure" id="result-figure">
          <img id="result-photo" class="result-photo-img" alt="" hidden />
          <span id="result-emoji">🦊</span>
        </div>
        <h3 class="result-name" id="result-name">캐릭터 이름</h3>
        <p class="result-match" id="result-match">당신과 92% 닮았어요!</p>
        <p class="result-tagline" id="result-tagline">"한줄 설명이 여기에 표시됩니다"</p>

        <div class="result-section">
          <h4 class="result-section-title">성향</h4>
          <div id="trait-bars"></div>
        </div>

        <div class="result-section">
          <p class="result-description" id="result-description"></p>
        </div>

        <div class="result-section">
          <h4 class="result-section-title">이런 사람이에요</h4>
          <ul class="result-list" id="result-traits"></ul>
        </div>

        <div class="result-section">
          <h4 class="result-section-title">당신과 닮은 이유</h4>
          <ul class="result-list" id="result-reasons"></ul>
        </div>

        <div class="result-actions">
          <button type="button" class="primary-btn" id="share-btn">📤 내 결과 공유하기</button>
          <button type="button" class="secondary-btn" id="restart-btn">🔄 다시 테스트하기</button>
        </div>
      </section>

    </main>
  </div>

  <div class="share-toast" id="share-toast"></div>

  <!-- 이모지 호환 처리: 일부 OS/브라우저에서 이모지가 네모(tofu)로 보이는 문제를 방지 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/twemoji.min.js" crossorigin="anonymous"></script>

  <!-- 데이터 파일들을 먼저 로드한 뒤, 로직 파일을 로드한다 -->
  <script src="characters.js"></script>
  <script src="tests.js"></script>
  <script src="app.js"></script>
</body>
</html>
